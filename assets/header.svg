<svg width="860" height="214" viewBox="0 0 860 214" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A git diff patching 'Former Cyber Security Expert' into 'I read source and fix real bugs in the code the world runs on — 47 merged'">
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
    <!-- card -->
    <rect x="1" y="1" width="858" height="212" rx="11" fill="#0B0E13" stroke="#2A313B"/>
    <!-- title bar -->
    <line x1="1" y1="43" x2="859" y2="43" stroke="#21262D"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="22" r="5" fill="#27c93f"/>
    <text x="86" y="27" font-size="13" fill="#8b949e" font-weight="600">IDENTITY.patch</text>
    <text x="836" y="27" font-size="13" text-anchor="end"><tspan fill="#7ee787">+39</tspan><tspan fill="#6e7681">  </tspan><tspan fill="#ff7b72">-1</tspan></text>

    <!-- hunk header -->
    <text x="24" y="77" font-size="14.5" fill="#58a6ff">@@ keep the airtight code, drop the old title @@</text>

    <!-- minus line -->
    <rect x="1.5" y="91" width="857" height="30" fill="#f85149" fill-opacity="0.10"/>
    <text x="26" y="111" font-size="15" fill="#ff7b72">-</text>
    <text x="50" y="111" font-size="15" fill="#ff7b72">Former Cyber Security Expert</text>

    <!-- plus line: the hero tagline -->
    <rect x="1.5" y="121" width="857" height="30" fill="#2ea043" fill-opacity="0.15"/>
    <text x="26" y="141" font-size="15" fill="#7ee787">+</text>
    <text x="50" y="141" font-size="16" fill="#7ee787" font-weight="600">I read source and fix real bugs in the code the world runs on.</text>

    <!-- plus line: the proof -->
    <rect x="1.5" y="151" width="857" height="30" fill="#2ea043" fill-opacity="0.15"/>
    <text x="26" y="171" font-size="15" fill="#7ee787">+</text>
    <text x="50" y="171" font-size="15" fill="#aff0c1">47 merged into Anthropic &#183; NVIDIA &#183; Rust &#183; OpenAI &#183; Meta &#183; Google &#8212; each with a test.</text>

    <!-- footer command -->
    <text x="24" y="201" font-size="12.5" fill="#6e7681">$ git log --oneline --merged --author=winklemad | wc -l&#160;&#160;&#8594;&#160;&#160;28</text>
  </g>
</svg>
